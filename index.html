<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scratch</title>
  <style>
    /* The typeface and ink color for the whole page. */
    body {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.125rem;
      line-height: 1.5;
      color: #1c1915;
      background: #f6f1e7;
    }

    /* Space around the words, and a line width that stays comfortable on a phone or a wide screen. */
    body {
      max-width: 34rem;
      margin: 0 auto;
      padding: 1.5rem;
    }

    /* Room between the heading, the paragraph, and the list. */
    h1 {
      margin-bottom: 0.25rem;
    }

    ul {
      padding-left: 1.25rem;
    }

    li {
      margin: 0.4rem 0;
    }
  </style>
</head>
<body>
  <h1>Scratch</h1>
  <p>Lines kept on one page. Change any of them, save, and refresh.</p>
  <ul>
    <li>Rewrite the heading</li>
    <li>Add a new line to this list</li>
    <li>Change the ink color in the style block</li>
  </ul>
</body>
</html>
